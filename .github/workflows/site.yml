# Page d'accueil de l'Atelier, https://pierreribeaucourt.github.io/atelier-mtg/ : la page « C'est quoi, l'Atelier
# MTG ? », pré-rendue pour les moteurs de recherche (outils/atelier/site_atelier.py), publiée sur GitHub Pages à chaque
# changement de l'Atelier. Réglage du dépôt : Settings › Pages › Source : GitHub Actions.
name: Page d'accueil

on:
  push:
    branches: [main]
    paths:
      - "outils/atelier/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Page pré-rendue (Chrome sans interface)
        run: python outils/atelier/site_atelier.py site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publication
        uses: actions/deploy-pages@v4
