<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#161513">
  <title>Atelier MTG</title>
  <link rel="canonical" href="https://atelier-mtg.com/mes-decks/">
  <style>
    :root { color-scheme: dark; --fond: #161513; --surface: #1f1e1b; --bord: #383530; --texte: #ece9e3; --texte-2: #a39d93;
      --accent: #f26b2c; --accent-texte: #1a0d05; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--fond);
      color: var(--texte); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 30rem; display: flex; flex-direction: column; gap: .9rem; }
    h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; }
    p { margin: 0; }
    .petit { font-size: .9rem; color: var(--texte-2); }
    .btn { font: inherit; font-weight: 600; min-height: 44px; padding: .8rem 1rem; border-radius: 10px;
      border: 1px solid var(--bord); background: var(--surface); color: var(--texte); cursor: pointer; }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-texte); }
    .btn:disabled { opacity: .6; cursor: default; }
    a { color: var(--accent); }
    #sans { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="decks" hidden>
    <h1>L'Atelier MTG déménage</h1>
    <p id="texte"></p>
    <button class="btn accent" id="transferer">Transférer mes decks</button>
    <button class="btn" id="fichier">Enregistrer mes decks dans un fichier</button>
    <p class="petit" id="aide" hidden></p>
    <a class="petit" id="sans" href="https://atelier-mtg.com/mes-decks/">Ouvrir la nouvelle adresse sans rien emporter</a>
  </main>
  <main id="pc" hidden>
    <h1>L'Atelier MTG déménage</h1>
    <p>L'appli est maintenant sur <strong>atelier-mtg.com</strong>, avec un compte. Tes decks sont sur ton PC : mets
      l'Atelier de ton PC à jour, puis « Passer en ligne ».</p>
    <button class="btn accent" id="continuer">Continuer</button>
  </main>
  <script>
  // Les anciennes adresses de l'appli (atelier-mtg.github.io, puis app.atelier-mtg.com), publiées par
  // telephone_site.py --passerelle : l'appli est maintenant sur atelier-mtg.com/mes-decks/, avec un compte.
  // Les decks d'un téléphone sans compte sont restés dans ce navigateur, sous l'ancienne adresse (IndexedDB
  // « atelier-telephone », clé « @depot ») : la passerelle les envoie à la nouvelle adresse, d'un onglet à l'autre
  // (demenagement.html, qui les garde jusqu'à la connexion au compte), sans passer par aucun serveur, ou dans un fichier
  // (format atelier-mtg-appli, « Importer des decks » de l'appli). Rien à emporter (déjà dans un compte, ou sur un PC
  // relié) : on part aussitôt, avec la fin de l'adresse (voir/…, jouer/…, #appairer=… des QR codes des anciens PC).
  (() => {
    const NOUVELLE = "https://atelier-mtg.com/mes-decks/", ORIGINE = "https://atelier-mtg.com", FAIT = "telephone-demenage";
    const $ = (id) => document.getElementById(id);
    const chemin = location.pathname.replace(/^\/+/, "");
    const partir = () => location.replace(NOUVELLE + (/^(voir|jouer)\//.test(chemin) ? chemin : "") + location.search + location.hash);
    const lire = (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } };
    const fini = () => { try { localStorage.setItem(FAIT, new Date().toISOString()); } catch (_) {} };
    const aide = (t) => { $("aide").textContent = t; $("aide").hidden = !t; };
    const IMPORTER = "sur atelier-mtg.com, connecte-toi, puis « Importer des decks » dans le menu de Mes decks.";

    // plus rien à garder ici : le service worker et les fichiers de l'ancienne appli
    try { navigator.serviceWorker.getRegistrations().then((l) => l.forEach((r) => r.unregister())).catch(() => {}); } catch (_) {}
    try { caches.keys().then((l) => l.forEach((k) => caches.delete(k))).catch(() => {}); } catch (_) {}

    // les fichiers des decks gardés ici ({chemin: texte}), sans rien d'autre (la base de cartes reste) ; {} : aucun
    const ouvrir = () => new Promise((ok) => {
      let r;
      try { r = indexedDB.open("atelier-telephone"); } catch (_) { return ok(null); }
      r.onupgradeneeded = () => r.transaction.abort();          // pas de base ici : on n'en crée pas
      r.onsuccess = () => ok(r.result.objectStoreNames.contains("fichiers") ? r.result : null);
      r.onerror = () => ok(null);
    });
    async function fichiersDecks() {
      const db = await ouvrir();
      if (!db) return {};
      const dep = await new Promise((ok) => {
        try {
          const r = db.transaction("fichiers", "readonly").objectStore("fichiers").get("@depot");
          r.onsuccess = () => ok(r.result || null);
          r.onerror = () => ok(null);
        } catch (_) { ok(null); }
      });
      const f = dep && dep.fichiers;
      return f && typeof f === "object" ? f : {};
    }

    let donnees = null, fenetre = null, minuteur = null;
    addEventListener("message", (ev) => {
      if (ev.origin !== ORIGINE || !fenetre || ev.source !== fenetre || !ev.data) return;
      const m = ev.data.atelier;
      if (m === "pret") fenetre.postMessage({ atelier: "donnees", ...donnees }, ORIGINE);
      else if (m === "recu") {
        clearTimeout(minuteur);
        fini();
        try { fenetre.close(); } catch (_) {}
        partir();
      } else if (m === "echec") {
        clearTimeout(minuteur);
        $("transferer").disabled = false;
        aide(`Le transfert n'a pas marché (${ev.data.message || "?"}) : enregistre plutôt tes decks dans un fichier.`);
      }
    });

    $("transferer").onclick = () => {
      fenetre = window.open(NOUVELLE + "demenagement.html");
      if (!fenetre) return aide("Ton navigateur a bloqué la nouvelle fenêtre : enregistre plutôt tes decks dans un fichier.");
      $("transferer").disabled = true;
      aide("Transfert en cours…");
      minuteur = setTimeout(() => {
        $("transferer").disabled = false;
        aide("La nouvelle adresse ne répond pas : enregistre plutôt tes decks dans un fichier.");
      }, 30000);
    };
    $("fichier").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(donnees)], { type: "application/json" }));
      a.download = `atelier-mtg-${donnees.date.slice(0, 10)}.json`;
      document.body.append(a);
      a.click();
      a.remove();
      aide("Fichier enregistré. Ensuite, " + IMPORTER);
    };
    $("sans").onclick = (ev) => { ev.preventDefault(); partir(); };
    $("continuer").onclick = () => { fini(); partir(); };

    (async () => {
      if (lire(FAIT)) return partir();
      if (lire("telephone-acces")) { $("pc").hidden = false; return; }     // relié à un PC : ses decks sont là-bas
      if (lire("atelier-compte")) return partir();                         // connecté à un compte : ses decks y sont
      const f = await fichiersDecks().catch(() => ({}));
      const n = Object.keys(f).filter((k) => /^Deck [^/]+\/archidekt\.txt$/.test(k)).length;
      if (!n) return partir();
      donnees = { format: "atelier-mtg-appli", version: 1, date: new Date().toISOString(), fichiers: { "@depot": { fichiers: f } } };
      $("texte").innerHTML = `L'appli est maintenant sur <strong>atelier-mtg.com</strong>, avec un compte. ${n > 1 ? `Tes ${n} decks sont restés` : "Ton deck est resté"} ici, à l'ancienne adresse : emporte-les.`;
      // iPhone, appli de l'écran d'accueil : ses données restent à part de Safari, le fichier est plus sûr
      if (navigator.standalone) {
        $("fichier").classList.add("accent");
        $("transferer").classList.remove("accent");
        aide("Sur iPhone, l'appli de l'écran d'accueil garde ses données à part : enregistre-les dans un fichier, puis, " + IMPORTER);
      }
      $("decks").hidden = false;
    })();
  })();
  </script>
</body>
</html>
