<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#161513">
  <title>Atelier MTG</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: #161513; color: #ece9e3; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  </style>
</head>
<body>
  <p id="etat">Transfert de tes decks…</p>
  <script>
  // L'appli a déménagé : la passerelle d'une ancienne adresse (passerelle.html), qui a ouvert cette page, lui envoie les
  // decks gardés là-bas (format atelier-mtg-appli). On les garde ici, dans la même base que telephone.js (IndexedDB
  // « atelier-telephone », clé « @demenagement », une liste : deux anciennes adresses peuvent envoyer) ; connectée au
  // compte, l'appli les y ajoute (telephone.js › reprendreDemenagement), sans doublons. Rien d'autre n'est touché.
  (() => {
    const ANCIENNES = ["https://atelier-mtg.github.io", "https://app.atelier-mtg.com"];
    const etat = (t) => { document.getElementById("etat").textContent = t; };
    if (!window.opener) { location.replace("./"); return; }
    const ouvrir = () => new Promise((ok, ko) => {
      const r = indexedDB.open("atelier-telephone", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("fichiers");
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ko(r.error);
    });
    const tx = (db, mode, f) => new Promise((ok, ko) => {
      const t = db.transaction("fichiers", mode), r = f(t.objectStore("fichiers"));
      t.oncomplete = () => ok(r && r.result);
      t.onerror = () => ko(t.error);
    });
    addEventListener("message", async (ev) => {
      if (!ANCIENNES.includes(ev.origin) || ev.source !== window.opener || !ev.data || ev.data.atelier !== "donnees") return;
      const repondre = (m) => { try { ev.source.postMessage(m, ev.origin); } catch (_) {} };
      try {
        const f = ((ev.data.fichiers || {})["@depot"] || {}).fichiers;
        if (!f || typeof f !== "object") throw new Error("aucun deck reçu");
        const recu = { format: "atelier-mtg-appli", version: 1, date: String(ev.data.date || ""), fichiers: { "@depot": { fichiers: f } } };
        const db = await ouvrir(), avant = await tx(db, "readonly", (s) => s.get("@demenagement"));
        await tx(db, "readwrite", (s) => s.put([...(Array.isArray(avant) ? avant : []), recu], "@demenagement"));
        localStorage.setItem("atelier-demenagement", "1");
        etat("C'est fait.");
        repondre({ atelier: "recu" });
        setTimeout(() => location.replace("./"), 1500);         // si la passerelle n'a pas pu fermer cet onglet
      } catch (e) {
        etat("Le transfert n'a pas marché.");
        repondre({ atelier: "echec", message: String((e && e.message) || e) });
      }
    });
    for (const o of ANCIENNES) window.opener.postMessage({ atelier: "pret" }, o);    // seule la bonne origine le reçoit
  })();
  </script>
</body>
</html>
