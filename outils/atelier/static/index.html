<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier MTG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11.5' cy='7' r='2.8' fill='%23f97316'/%3E%3Ccircle cx='18.5' cy='3.6' r='2' fill='%23f97316'/%3E%3Ccircle cx='19.8' cy='9.6' r='1.6' fill='%23f97316'/%3E%3Cpath d='M8 27.5 6.6 30.6M24 27.5l1.4 3.1' stroke='%239a3412' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M5 15h22c1 1.9 1.5 3.7 1.5 5.7 0 4.6-5.4 7.8-12.5 7.8S3.5 25.3 3.5 20.7c0-2 .5-3.8 1.5-5.7z' fill='%23c2410c'/%3E%3Crect x='2' y='11.5' width='28' height='5.2' rx='2.6' fill='%239a3412'/%3E%3Cpath d='M8 19.5c1.5 3.5 4.2 5 8 5' stroke='%23fdba74' stroke-width='1.6' fill='none' stroke-linecap='round' opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="barre">
    <a href="#/" class="logo">Atelier MTG</a>
    <div class="aller">
      <input id="aller" class="champ" type="search" placeholder="Chercher une carte ou un deck…" autocomplete="off"
        aria-label="Chercher une carte ou un deck" aria-controls="aller-liste" aria-autocomplete="list">
      <div id="aller-liste" class="aller-liste" role="listbox" hidden></div>
    </div>
    <a href="#/recherche" id="lien-recherche" class="btn btn-discret lien-recherche" data-ico="chercher"><span>Recherche<span class="long">&nbsp;de cartes</span></span></a>
    <a href="#/classeur" id="lien-classeur" class="btn btn-discret lien-recherche" data-ico="livre"><span>Classeur</span></a>
    <div class="espace"></div>
    <div class="barre-droite">
      <span id="etat-maj" class="etat-maj"></span>
      <button id="btn-rafraichir" class="btn btn-discret" data-ico="rafraichir" title="Rafraîchir les prix du jour et la liste officielle des Game Changers">Rafraîchir</button>
      <a href="#/options" id="lien-options" class="btn btn-discret" data-ico="options" title="Options" aria-label="Options"></a>
      <button id="btn-theme" class="btn btn-discret" data-ico="theme" title="Thème clair ou sombre" aria-label="Thème clair ou sombre"></button>
      <button id="btn-chat" class="btn btn-accent" data-ico="discussion" data-pc="claude"><span class="txt">Demander à Claude</span></button>
    </div>
  </header>
  <div class="cadre">
    <main id="vue" class="vue"></main>
    <aside id="chat" class="chat" hidden></aside>
  </div>
  <div id="modale" class="modale" hidden></div>
  <div id="menu" class="menu" hidden></div>
  <div id="apercu" class="apercu" hidden><img alt=""><div class="legende" hidden></div></div>
  <div id="bulle" class="bulle" role="tooltip" hidden></div>
  <div id="fiche-survol" class="fiche-survol" role="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/reglages.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
