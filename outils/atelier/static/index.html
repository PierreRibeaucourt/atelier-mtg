<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier MTG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='3' fill='%23c2410c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="barre">
    <a href="#/" class="logo">Atelier MTG</a>
    <div class="aller">
      <input id="aller" class="champ" type="search" placeholder="Aller à un deck…" autocomplete="off"
        aria-label="Aller à un deck" aria-controls="aller-liste" aria-autocomplete="list">
      <kbd class="aller-touche" aria-hidden="true">Ctrl K</kbd>
      <div id="aller-liste" class="aller-liste" role="listbox" hidden></div>
    </div>
    <div class="espace"></div>
    <div class="barre-droite">
      <span id="etat-maj" class="etat-maj"></span>
      <button id="btn-rafraichir" class="btn btn-discret" title="Rafraîchir les prix du jour et la liste officielle des Game Changers">Rafraîchir</button>
      <button id="btn-theme" class="btn btn-discret" title="Thème clair ou sombre" aria-label="Thème clair ou sombre">◐</button>
      <button id="btn-chat" class="btn btn-accent">Discussion</button>
    </div>
  </header>
  <div class="cadre">
    <main id="vue" class="vue"></main>
    <aside id="chat" class="chat" hidden></aside>
  </div>
  <div id="modale" class="modale" hidden></div>
  <div id="menu" class="menu" hidden></div>
  <div id="apercu" class="apercu" hidden><img alt=""><div class="legende" hidden></div></div>
  <div id="bulle" class="bulle" role="tooltip" hidden></div>
  <div id="fiche-survol" class="fiche-survol" role="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
